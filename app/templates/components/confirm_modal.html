<!-- Shared confirmation modal. Any <form data-confirm="message text"> on
     the page is intercepted by main.js, which fills in this modal and
     only submits the form once the user clicks "Confirm" here; this is
     what replaced the original app's plain (and mostly unconfirmed)
     destructive GET links. -->
<div class="modal fade" id="confirmActionModal" tabindex="-1" aria-labelledby="confirmActionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmActionModalLabel">Please confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">Are you sure?</div>
      <div class="modal-footer">
        <button type="button" class="btn-tma btn-tma--ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-tma btn-tma--accent" data-confirm-accept>Confirm</button>
      </div>
    </div>
  </div>
</div>
