{% extends "base_template.html" %}

{% block title %}Add Staff{% endblock %}

{% block content %}
<!-- wrapper for the admin staff form -->
<div class="container py-4">
    <div class="glass-card mx-auto" style="max-width:1000px;">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">Add New Staff Member</h2>
                <p class="text-muted mb-0">Enter credentials, contact details, and qualifications to create a new staff profile.</p>
            </div>
            <a href="/admin/staff" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>
        <form method="POST">

            <!--Staff Details-->
            <div class="row">
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Enter full name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="Enter email address" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" class="form-control" name="phone" placeholder="Enter contact number (e.g. 99345XXXXX)">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter password for staff login" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Approval Status</label>
                    <select class="form-select" name="staff_status">
                        <option value="Approved" selected>Approved</option>
                        <option value="Pending">Pending</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label">Experience & Certifications</label>
                    <textarea name="experience" rows="4" class="form-control" placeholder="Write a short description of experience, regions guided, certifications..."></textarea>
                </div>
            </div>

            <!-- Submit/Cancel button -->
             <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('manageStaff') }}" class="btn btn-outline-secondary px-3">Cancel</a>
                <button type="submit" class="btn btn-success px-3">Add Staff</button>
             </div>
        </form>
    </div>
</div>
{% endblock %}

{% block style %}
<style>
    /* standard admin form styles */
    .glass-card{
        background: rgba(255,255,255,0.95);
        border-radius:20px;
        padding:35px;
        box-shadow:0 10px 30px rgba(0,0,0,.12);
    }
    .form-control,
    .form-select{
        border-radius:10px;
        padding:10px 14px;
    }
    .form-control:focus,
    .form-select:focus{
        box-shadow:none;
        border-color:#198754;
    }

    textarea{
        resize:none;
    }
</style>
{% endblock %}
