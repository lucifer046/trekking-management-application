{% extends "base_template.html" %}

{% block title %}Update Trek{% endblock %}

{% block content %}
<!-- updating existing trek properties -->
<div class="container py-4">
    <div class="glass-card mx-auto" style="max-width:1000px;">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">Edit Trek Details</h2>
                <p class="text-muted mb-0">Update the slots, schedule, difficulty, status, or description for this trek.</p>
            </div>
            <a href="/admin/treks" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>
        <form method="POST">

            <!--Trek Details-->
            <div class="row">
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Trek Name</label>
                    <input type="text" class="form-control" name="name" value="{{ trek.name }}" placeholder="Enter trek name">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" value="{{ trek.location }}" placeholder="Enter your location">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-select" >
                        <option value="">Select Difficulty</option>
                        <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Maximum Slots</label>
                    <input type="number" class="form-control" name="max_people" value="{{ trek.max_people }}" min="1" placeholder="Eg. 10">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Stay Duration (Days)</label>
                    <input type="number" class="form-control" name="days" value="{{ trek.days }}" min="1" placeholder="Eg. 3">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="open" {% if trek.status == 'open' %}selected{% endif %}>Open</option>
                        <option value="closed" {% if trek.status == 'closed' %}selected{% endif %}>Closed</option>
                        <option value="completed" {% if trek.status == 'completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}">
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label">Description</label>
                    <textarea name="description" rows="4" class="form-control" placeholder="Write a short description about the trek...">{{ trek.description }}</textarea>
                </div>
            </div>

            <!-- Submit/Reject button. -->
             <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('adminTreks') }}" class="btn btn-outline-secondary  px-3">Cancel</a>
                <button type="submit" class="btn btn-outline-success px-2">Update Trek</button>
             </div>
        </form>
    </div>
</div>
{% endblock %}

{% block style %}

<style>
    /* same form styles for editing */
    .glass-card{
        background: rgba(255,255,255,0.95);
        border-radius:20px;
        padding:35px;
        box-shadow:0 10px 30px rgba(0,0,0,.12);
    }
    .form-control,
    .form-select{
        border-radius:10px;
        padding:10px 14px;
    }
    .form-control:focus,
    .form-select:focus{
        box-shadow:none;
        border-color:#198754;
    }

    textarea{
        resize:none;
    }

</style>
{% endblock %}
