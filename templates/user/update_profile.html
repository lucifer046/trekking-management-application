{% extends "base_template.html" %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1 text-black">Update Profile</h2>
        <p class="text-white">
            Manage your personal contact details and password.
        </p>
    </div>
    <div>
        <a href="{{ url_for('userDashboard') }}" class="btn btn-outline-light">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>
</div>

<div class="container py-3">
    <div class="glass-card">
        <h4 class="fw-bold mb-4">Profile Information</h4>
        <!-- form to change user details -->
        <form method="POST" action="{{ url_for('userUpdateProfile') }}">
            <!-- details fields input group -->
            <div class="row g-3">
                
                <div class="col-md-6">
                    <label for="name" class="form-label">Full Name:</label>
                    <input type="text" name="name" id="name" class="form-control" 
                           value="{{ user.name }}" placeholder="Enter full name" required>
                </div>
                
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address:</label>
                    <input type="email" name="email" id="email" class="form-control" 
                           value="{{ user.email }}" placeholder="Enter email address" required>
                </div>
                
                <div class="col-md-6">
                    <label for="contact" class="form-label">Contact Number:</label>
                    <input type="text" name="contact" id="contact" class="form-control" 
                           value="{{ user.phone or '' }}" placeholder="Enter contact number">
                </div>
                
                <div class="col-md-6 d-none d-md-block"></div> <!-- Spacer to align password fields  -->
                
                <!-- password updates inputs -->
                <div class="col-md-6">
                    <label for="password" class="form-label">New Password:</label>
                    <input type="password" name="password" id="password" class="form-control" 
                           placeholder="Leave blank to keep current password">
                </div>
                
                <div class="col-md-6">
                    <label for="confirm_password" class="form-label">Confirm New Password:</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" 
                           placeholder="Confirm new password">
                </div>
            </div>
            
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-outline-success px-4">
                    <i class="bi bi-check2-circle me-1"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block style %}
<style>
    /* standard glass card look for the profile box */
    .glass-card {
        max-width: 800px;
        margin: auto;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    }
    .form-control {
        border-radius: 10px;
        padding: 10px 14px;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #198754;
    }
</style>
{% endblock %}
